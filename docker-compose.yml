services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: delivery-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: delivery-local-cluster
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: delivery-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: delivery-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: delivery-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  osrm-download:
    image: curlimages/curl:8.12.1
    user: "0:0"
    volumes:
      - osrm-data:/data
    entrypoint: ["sh", "-ec"]
    command:
      - |
        if [ -s /data/toulouse.osm.pbf ]; then
          echo "OSM extract already downloaded."
          exit 0
        fi
        echo "Downloading Toulouse region OSM extract..."
        curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 \
          https://download.geofabrik.de/europe/france/midi-pyrenees-latest.osm.pbf \
          --output /data/toulouse.osm.pbf.part
        mv /data/toulouse.osm.pbf.part /data/toulouse.osm.pbf

  osrm-init:
    build:
      context: ./infra/osrm
      dockerfile: Dockerfile.init
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully

  osrm:
    image: osrm/osrm-backend:latest
    container_name: delivery-osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data:ro
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    command: ["osrm-routed", "--algorithm", "mld", "/data/toulouse.osrm"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /route/v1/driving/1.4440,43.6045;1.4700,43.6100?overview=false HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r -t 4 status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delivery
      SPRING_DATASOURCE_USERNAME: delivery
      SPRING_DATASOURCE_PASSWORD: delivery
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_ROUTING_OSRM_BASE_URL: http://osrm:5000
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    container_name: delivery-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  osrm-data:
